# =============================================================================
# iSign Sign Language Translation — Gloss-Free (pose features → English)
# =============================================================================
# Pipeline: .pose → (T,2304) → VisualHead(2304→512) → VLMapper(512→1024) → mBART-large-cc25
#
# task: S2T with recognition_weight=0 achieves gloss-free training:
#   - RecognitionNetwork forward pass still runs to produce gloss_feature
#   - CTC loss on empty targets is multiplied by 0 → no gradient effect
#   - Only mBART cross-entropy (translation_loss) drives gradient updates
#   - No changes to model.py, training.py, Dataloader.py, or recognition.py
#
# mBART: facebook/mbart-large-cc25 downloaded locally
#   - pretrained_models/mBart_en/ (created by Block 2 setup script)
#   - map_ids.pkl = identity mapping (no vocab pruning)
#   - G2T gloss2ids.pkl = {<unk>:0, <pad>:1, </s>:2, en_ISL:3}
#   - gloss_embeddings.bin = {} (all 4 G2T gloss tokens trained from scratch)
# =============================================================================

task: S2T

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  dataset_name: isign          # triggers ISignDataset in build_dataset()

  # Split CSVs — generated by generate_isign_splits.py
  train: data/isign/train.csv
  dev:   data/isign/dev.csv
  test:  data/isign/test.csv

  # Absolute path — pose files live at /workspace, outside TwoStreamNetwork/
  pose_dir: /workspace/isign_data/iSign-poses_v1.1

  # Feature-mode: no video loading. Features come directly from ISignDataset.
  input_data: feature

  # Single RGB stream — routes pose features through visual_head (not visual_head_keypoint)
  # ISignDataset returns key 'head_rgb_input' to match this path exactly.
  input_streams:
    - rgb

  # mBART sentencepiece tokenizer settings
  level: sentencepiece
  max_sent_length: 400
  txt_lowercase: false          # English is case-sensitive; do not lowercase

# ---------------------------------------------------------------------------
# Testing / inference
# ---------------------------------------------------------------------------
testing:
  cfg:
    recognition:
      beam_size: 1
    translation:
      length_penalty: 1
      max_length: 100
      num_beams: 5

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  batch_size: 16
  keep_last_ckpts: 5
  num_workers: 4

  model_dir: experiments/outputs/TwoStream/isign_s2t
  overwrite: true
  random_seed: 42
  shuffle: true
  total_epoch: 40

  optimization:
    optimizer: Adam
    betas:
      - 0.9
      - 0.998
    weight_decay: 0.001
    learning_rate:
      default: 0.0003        # VisualHead + recognition output layer
      mapper: 0.001          # VLMapper (projection, trained from scratch)
      translation: 1.0e-05   # mBART (fine-tuning the pretrained model)
    scheduler: cosineannealing
    t_max: 40

  validation:
    unit: step
    freq: 2000
    cfg:
      recognition:
        beam_size: 1
      translation:
        length_penalty: 1
        max_length: 100
        num_beams: 5

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  # recognition_weight=0: CTC contribution is zeroed out → gloss-free training.
  # The RecognitionNetwork still runs to produce gloss_feature for VLMapper.
  recognition_weight: 0
  translation_weight: 1

  RecognitionNetwork:
    # Minimal 3-token S2G vocab: <s>=0 (silence/CTC-blank), <unk>=1, <pad>=2
    # Generated by generate_isign_gloss_vocab.py
    GlossTokenizer:
      gloss2id_file: data/isign/gloss2ids.pkl

    # Single-stream feature mode: no S3D backbone, no video loading
    fuse_method: empty

    # VisualHead: (T, 2304) → (T, 512)
    # input_size = 576 landmarks × 4 channels (x, y, z, confidence) = 2304
    visual_head:
      input_size: 2304
      hidden_size: 512
      ff_size: 2048
      ff_kernelsize:
        - 3
        - 3
      pe: true              # positional encoding for temporal order

    # pyramid keys must be present (used in recognition.py conditionals)
    pyramid:
      version: null
      rgb: null
      pose: null

  TranslationNetwork:
    # facebook/mbart-large-cc25 downloaded to pretrained_models/mBart_en/
    pretrained_model_name_or_path: pretrained_models/mBart_en

    TextTokenizer:
      pretrained_model_name_or_path: pretrained_models/mBart_en
      pruneids_file: pretrained_models/mBart_en/map_ids.pkl
      tgt_lang: en_XX         # mBART English language code

    # G2T GlossTokenizer: provides </s> and en_ISL for suffix embedding.
    # The suffix [</s>, en_ISL] is appended to the visual feature sequence
    # in TranslationNetwork.prepare_feature_inputs() so mBART knows the source.
    GlossTokenizer:
      gloss2id_file: pretrained_models/mBart_en/gloss2ids.pkl
      src_lang: en_ISL        # custom source lang tag for Indian Sign Language

    # Empty gloss_embeddings.bin → all 4 G2T gloss tokens (unk,pad,</s>,en_ISL)
    # are initialized randomly and learned during training.
    GlossEmbedding:
      freeze: false
      gloss2embed_file: pretrained_models/mBart_en/gloss_embeddings.bin

    gls_eos: gls              # use G2T gloss embedding for </s> and src_lang suffix

    label_smoothing: 0.2
    freeze_txt_embed: false

    overwrite_cfg:
      attention_dropout: 0.1
      dropout: 0.2

  # VLMapper: VisualHead hidden (512) → mBART d_model (1024)
  VLMapper:
    type: projection
    in_features: 512          # must match visual_head.hidden_size above
    multistream_fuse: empty
